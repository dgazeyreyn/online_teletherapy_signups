models:
  - name: stg_bh__goals
    description: Staging model based on log_visitor data source
    columns:
      - name: goal_id
        description: Surrogate key created based on a combination of 'stat_datetime', 'goal_name', 'stat_ad_id', 'stat_affiliate_info5'.
        data_tests:
          - unique
          - not_null
      
      - name: conversion_at_est
        description: Date/time that a User Signup or Trial Converted event occurred; IMPORTANT - Per client, stat_datetime was recorded as local EST clock time in their source system (PostgreSQL).  However, I loaded into BigQuery as a timezone-naive TIMESTAMP and BigQuery always displays TIMESTAMP values as UTC.
        data_tests:
          - not_null
      
      - name: conversion_at_utc
        description: Values are reinterpreted as America/New_York and converted to UTC to restore correct event ordering.
        data_tests:
          - not_null
      
      - name: goal_name
        description: Will be one of either `User Signup` or `Trial Converted`.
        data_tests:
          - not_null
          - accepted_values:
              values: ["User Signup", "Trial Converted"]
      
      - name: country_name
        description: Self-explanatory
      
      - name: stat_ad_id
        description: Unique ID for a user assigned by BetterHelp. Note that this unique ID will be duplicated across two rows for a user who both signs up and converts.
        data_tests:
          - not_null
      
      - name: stat_affiliate_info1
        data_tests:
          - not_null
          - accepted_values:
              values: ["fm", "md", "pm", "rd"]
      
      - name: stat_affiliate_info2
        description: Will be either mobile_web, desktop_web, mobile_app, email.
        data_tests:
          - not_null
          - accepted_values:
              values: ["email", "mobile_app", "mobile_web", "desktop_web"]
      
      - name: stat_affiliate_info3
        description: '{{ doc("bh_Stat_affiliate_info3") }}'
      
      - name: stat_affiliate_info4
        description: Records test that user came from (if from a results screen), blank otherwise; It’s possible that a user can come from Google Ads - and so have a gclid assigned - but signup via a listing page rather than a results page. In that scenario Stat.affiliate_info4 will be blank.
      
      - name: mduid
        description: Foreign Key to visitor; 1,491 rows are null
      
      - name: ConversionsMobile_affiliate_click_id
        description: GCLID (if available, and denotes Google Ads-derived traffic), otherwise blank (which denotes organic traffic).
