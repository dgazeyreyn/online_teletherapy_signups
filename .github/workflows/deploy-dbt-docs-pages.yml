# Build and publish dbt docs (BigQuery) to GitHub Pages using the Pages Actions
# Triggers on push to main (adjust branch as needed)
name: Build and publish dbt docs to GitHub Pages (BigQuery)

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    env:
      # expose the secrets as env to allow substitution into profiles.yml
      DBT_PROJECT_ID: ${{ secrets.DBT_PROJECT_ID }}
      DBT_DATASET: ${{ secrets.DBT_DATASET }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dbt (BigQuery adapter)
        run: |
          python -m pip install --upgrade pip
          pip install dbt-bigquery

      - name: Write GCP service account key (from secret) and set GOOGLE_APPLICATION_CREDENTIALS
        run: |
          mkdir -p $HOME/.gcp
          echo "${{ secrets.GCP_SA_KEY }}" > $HOME/.gcp/gcp-key.json
          chmod 600 $HOME/.gcp/gcp-key.json
        # keep the key as a secret value (GITHUB masks secrets in logs)
      - name: Export GOOGLE_APPLICATION_CREDENTIALS
        run: echo "GOOGLE_APPLICATION_CREDENTIALS=$HOME/.gcp/gcp-key.json" >> $GITHUB_ENV

      - name: Create dbt profiles.yml (BigQuery service-account)
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml <<YML
          default:
            target: prod
            outputs:
              prod:
                type: bigquery
                method: service-account
                project: ${DBT_PROJECT_ID}
                dataset: ${DBT_DATASET}
                keyfile: $HOME/.gcp/gcp-key.json
                threads: 4
                priority: interactive
          YML

      - name: (Optional) Cache pip to speed up runs
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: dbt deps --profiles-dir ~/.dbt and compile
        run: |
          dbt deps --profiles-dir ~/.dbt
          dbt compile --profiles-dir ~/.dbt

      - name: Generate dbt docs
        run: dbt docs generate --profiles-dir ~/.dbt

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v3

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v2
        with:
          path: ./target

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v1
