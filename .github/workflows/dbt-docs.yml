name: Generate and Deploy dbt Docs

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dbt-docs:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Check out the repository
      - name: Checkout repo
        uses: actions/checkout@v4

      # 2️⃣ Set up Python
      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      # 3️⃣ Install dbt-bigquery
      - name: Install dbt-bigquery
        run: |
          python -m pip install --upgrade pip
          pip install dbt-bigquery==1.10.3

      # 4️⃣ Write BigQuery service account key
      - name: Write BigQuery service account key
        run: |
          mkdir -p /home/runner/.gcp
          echo '${{ secrets.GCP_SA_KEY }}' > /home/runner/.gcp/gcp-key.json

      # 5️⃣ Write dbt profiles.yml
      - name: Set up dbt profiles
        run: |
          mkdir -p ~/.dbt
          python - <<'PY'
          import pathlib, textwrap

          profiles = textwrap.dedent("""\
          default:
            target: dev
            outputs:
              dev:
                type: bigquery
                method: service-account
                project: "mind-diagnostics-414622"
                dataset: "dbt_dreynolds"
                location: "US"
                keyfile: "/home/runner/.gcp/gcp-key.json"
                threads: 4
                timeout_seconds: 300
          """)

          path = pathlib.Path.home() / ".dbt" / "profiles.yml"
          path.write_text(profiles)
          print("Wrote", path)
          PY

      - name: Debug profiles.yml
        run: |
          echo "---- ~/.dbt/profiles.yml ----"
          sed -n '1,120p' ~/.dbt/profiles.yml
          echo "-----------------------------"
          ls -ლა /home/runner/.gcp || true

      # 6️⃣ Install dbt dependencies
      - name: Install dbt deps
        run: dbt deps

      # 7️⃣ Generate dbt docs
      - name: Generate dbt docs
        run: dbt docs generate

      - name: Verify dbt output
        run: |
          pwd
          ls -la
          ls -la target || true

      - name: Fix GitHub Pages base path
        run: |
          OWNER=$(echo $GITHUB_REPOSITORY | cut -d'/' -f1)
          REPO=$(echo $GITHUB_REPOSITORY | cut -d'/' -f2)

          BASE="/$OWNER/$REPO/"

          echo "Injecting base href: $BASE"

          sed -i "0,/<head>/s|<head>|<head><base href=\"$BASE\">|" target/index.html

          touch target/.nojekyll

      - name: Deploy docs to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: target
          publish_branch: gh-pages
