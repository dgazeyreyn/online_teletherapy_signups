name: Generate and Deploy dbt Docs

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  dbt-docs:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Check out the repository
      - name: Checkout repo
        uses: actions/checkout@v4

      # 2️⃣ Set up Python
      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      # 3️⃣ Install dbt-bigquery
      - name: Install dbt-bigquery
        run: |
          python -m pip install --upgrade pip
          pip install dbt-bigquery==1.10.3

      # 4️⃣ Write BigQuery service account key
      - name: Set up GCP keyfile
        run: |
          mkdir -p $HOME/.dbt
          echo "${{ secrets.GCP_SA_KEY }}" > $HOME/.dbt/bigquery-sa.json

      # 5️⃣ Write dbt profiles.yml
      - name: Set up dbt profiles
        run: |
          mkdir -p $HOME/.dbt
          cat <<EOF > $HOME/.dbt/profiles.yml
          default:
            target: dev
            outputs:
              dev:
                type: bigquery
                method: service-account
                project: zi-case-study
                dataset: dbt_dreynolds
                location: US
                keyfile: $HOME/.dbt/bigquery-sa.json
                threads: 4
                timeout_seconds: 300
          EOF

      # 6️⃣ Install dbt dependencies
      - name: Install dbt deps
        run: dbt deps

      # 7️⃣ Generate dbt docs
      - name: Generate dbt docs
        run: dbt docs generate

      # 8️⃣ Deploy dbt docs to GitHub Pages
      - name: Deploy dbt docs to GitHub Pages
        uses: peaceiris/actions-gh-pages@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./target
