name: Generate and Deploy dbt Docs

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dbt-docs:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Check out the repository
      - name: Checkout repo
        uses: actions/checkout@v4

      # 2️⃣ Set up Python
      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dbt-bigquery
        run: |
          python -m pip install --upgrade pip
          python -m pip install --force-reinstall dbt-core==1.10.15 dbt-bigquery==1.10.3

      # 4️⃣ Write BigQuery service account key
      - name: Write BigQuery service account key
        run: |
          mkdir -p /home/runner/.gcp
          echo '${{ secrets.GCP_SA_KEY }}' > /home/runner/.gcp/gcp-key.json

      # 5️⃣ Write dbt profiles.yml
      - name: Set up dbt profiles
        run: |
          mkdir -p ~/.dbt
          python - <<'PY'
          import pathlib, textwrap

          profiles = textwrap.dedent("""\
          default:
            target: dev
            outputs:
              dev:
                type: bigquery
                method: service-account
                project: "mind-diagnostics-414622"
                dataset: "dbt_dreynolds"
                location: "US"
                keyfile: "/home/runner/.gcp/gcp-key.json"
                threads: 4
                timeout_seconds: 300
          """)

          path = pathlib.Path.home() / ".dbt" / "profiles.yml"
          path.write_text(profiles)
          print("Wrote", path)
          PY

      # 6️⃣ Install dbt dependencies
      - name: Install dbt deps
        run: dbt deps

      # 7️⃣ Generate dbt docs
      - name: Generate dbt docs
        run: dbt docs generate --profiles-dir ~/.dbt

      - name: Fix GitHub Pages base path
        run: |

          touch target/.nojekyll

      - name: Verify deployment contents
        run: |
          echo "=== target ==="
          ls -la target

          echo
          echo "=== index.html contains base tag? ==="
          grep -n "<base" target/index.html || true

          echo
          echo "=== first 20 lines of index.html ==="
          head -20 target/index.html

      # - name: Deploy docs to GitHub Pages
      #   uses: peaceiris/actions-gh-pages@v3
      #   with:
      #     github_token:
      #     publish_dir: target
      #     publish_branch: gh-pages

      - name: Build published site
        run: |
          mkdir site

          # Copy landing page
          cp index.html site/

          # Copy dbt docs under a subdirectory
          mkdir site/dbt-docs
          cp -R target/* site/dbt-docs/

          # Prevent GitHub Pages from processing dbt assets
          touch site/.nojekyll

      - name: Deploy docs to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          